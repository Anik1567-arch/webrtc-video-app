<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Video Call</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Lobby Screen: Enter Room Code -->
    <div id="lobby-container" class="lobby-container">
        <div class="lobby-card">
            <h1>⚡ Direct Video Call</h1>
            <p>Enter a secret Room Name and share it with your friend to connect peer-to-peer.</p>
            <div class="input-group">
                <input type="text" id="room-input" placeholder="e.g., study-room-99" autocomplete="off" />
                <button id="join-btn">Join Call</button>
            </div>
            <p id="lobby-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div id="call-container" class="call-container hidden">
        <div class="status-banner" id="status-banner">Waiting for your friend to join...</div>
        
        <div class="video-grid">
            <!-- Friend's Video (Full Screen) -->
            <video id="remote-video" autoplay playsinline></video>
            
            <!-- Your Video (Floating Picture-in-Picture) -->
            <div class="local-video-wrapper">
                <video id="local-video" autoplay muted playsinline></video>
                <span class="video-label">You</span>
            </div>
        </div>

        <!-- Call Controls Bar -->
        <div class="controls-bar">
            <button id="mic-btn" class="control-btn active" title="Toggle Microphone">
                <span id="mic-icon">🎤 Mute</span>
            </button>
            <button id="cam-btn" class="control-btn active" title="Toggle Camera">
                <span id="cam-icon">📷 Stop Video</span>
            </button>
            <button id="leave-btn" class="control-btn danger" title="End Call">
                <span>📞 End Call</span>
            </button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
